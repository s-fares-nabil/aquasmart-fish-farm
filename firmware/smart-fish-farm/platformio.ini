[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

lib_deps =
    blynk/Blynk @ ^1.3.3
    adafruit/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.7

build_flags =
    -DBLYNK_PRINT=Serial
    -DCORE_DEBUG_LEVEL=1

extra_scripts =
    pre:scripts/version.py
